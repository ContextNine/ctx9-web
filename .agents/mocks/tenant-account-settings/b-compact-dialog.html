<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compact settings dialog mock</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font:
          14px system-ui,
          sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: 220px 1fr;
        width: min(920px, 92vw);
        height: min(640px, 84vh);
        border: 1px solid #27272a;
        border-radius: 10px;
        overflow: hidden;
        background: #09090b;
      }
      aside,
      section {
        padding: 32px;
      }
      aside {
        border-right: 1px solid #27272a;
      }
      nav {
        display: grid;
        gap: 8px;
        margin-top: 24px;
      }
      button {
        padding: 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #a1a1aa;
        text-align: left;
      }
      button[aria-current="page"] {
        background: #27272a;
        color: white;
      }
      p {
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <main role="dialog" aria-modal="true">
      <aside>
        <h1>Settings</h1>
        <nav>
          <button aria-current="page">Tenant</button><button>Access</button
          ><button>Account security</button>
        </nav>
      </aside>
      <section>
        <h2>Tenant</h2>
        <p>A smaller dialog keeps more of the application visible.</p>
      </section>
    </main>
  </body>
</html>
