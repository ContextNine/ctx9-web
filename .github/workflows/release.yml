name: Mirror source

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: gitlab-mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'ContextNine/ctx9-web' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Mirror master source
        env:
          GITLAB_CTX9_MIRROR_SSH_KEY: ${{ secrets.GITLAB_CTX9_MIRROR_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GITLAB_CTX9_MIRROR_SSH_KEY" >"$HOME/.ssh/ctx9-mirror"
          chmod 600 "$HOME/.ssh/ctx9-mirror"
          ssh-keyscan -H gitlab.com >"$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/ctx9-mirror -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          remote="git@gitlab.com:ctx9/web.git"
          git push "$remote" HEAD:refs/heads/master
