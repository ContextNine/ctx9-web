name: Publish npm packages

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'ContextNine/ctx9-web'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        node: [22.16.0, 24.21.0, 26.11.1]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: npm-publication
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
      - name: Verify release identity
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Verify all approved npm publisher connections
        run: node --experimental-strip-types scripts/check-npm-publishers.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:build
      - uses: actions/upload-artifact@v7
        with:
          name: web-${{ github.ref_name }}
          path: dist-release/
          if-no-files-found: error
      - name: Publish immutable archives using npm OIDC
        run: |
          set -eu
          npm publish ./dist-release/ctx9-ui-*.tgz --access public --provenance --registry=https://registry.npmjs.org/
          npm publish ./dist-release/ctx9-web-auth-*.tgz --access public --provenance --registry=https://registry.npmjs.org/
          npm publish ./dist-release/ctx9-identity-*.tgz --access public --provenance --registry=https://registry.npmjs.org/
