include:
  - project: ctx9/delivery
    ref: 5c8e2ce763733b9fe3337e8af86e00c577c50fbe
    file: /ci/component.yml

stages: [check]

variables:
  DELIVERY_FLOW: ctx9
  DELIVERY_EXPECTED_RUNNER_DESCRIPTION: ctx9-group
  DELIVERY_EXPECTED_RUNNER_TAG: ctx9-self-managed
  DELIVERY_RUNNER_TAG: ctx9-self-managed

check:
  extends: .delivery-runner-guard
  stage: check
  image: node:22.16.0-bookworm-slim@sha256:048ed02c5fd52e86fda6fbd2f6a76cf0d4492fd6c6fee9e2c463ed5108da0e34
  tags: [ctx9-self-managed]
  interruptible: true
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm check
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - packages/*/dist
