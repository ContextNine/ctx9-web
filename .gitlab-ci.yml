include:
  - project: ctx9/delivery
    ref: 5c8e2ce763733b9fe3337e8af86e00c577c50fbe
    file: /ci/component.yml

stages: [check, publish]

variables:
  DELIVERY_FLOW: ctx9
  DELIVERY_EXPECTED_RUNNER_DESCRIPTION: ctx9-group
  DELIVERY_EXPECTED_RUNNER_TAG: ctx9-self-managed
  DELIVERY_RUNNER_TAG: ctx9-self-managed

check:
  extends: .delivery-runner-guard
  stage: check
  image: node:24.19.0-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
  tags: [ctx9-self-managed]
  interruptible: true
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm check
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - packages/*/dist

publish:
  extends: .delivery-runner-guard
  stage: publish
  image: node:24.19.0-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
  tags: [ctx9-self-managed]
  variables:
    DELIVERY_REQUIRE_PROTECTED_REF: "true"
  needs: [check]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - test "$CI_COMMIT_TAG" = "v$(node -p 'require("./package.json").version')"
    - printf '//gitlab.com/api/v4/projects/85438020/packages/npm/:_authToken=${CI_JOB_TOKEN}\n' >.npmrc.ci
    - trap 'rm -f .npmrc.ci' EXIT
    - pnpm release:build
    - npm publish dist-release/ctx9-ui-*.tgz --userconfig=.npmrc.ci
    - npm publish dist-release/ctx9-web-auth-*.tgz --userconfig=.npmrc.ci
  artifacts:
    when: on_success
    expire_in: never
    paths:
      - dist-release/
